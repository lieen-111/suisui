# XcodeGen spec. Generate the Xcode project with:  xcodegen generate  (run inside ios/)
# No Mac? The GitHub Actions workflows in .github/workflows run this on a hosted Mac.
#
# Change BASE_BUNDLE_ID to an identifier you own before the first TestFlight build,
# e.g. com.<your-pinyin-name>.suisui . CI can also override it:  BASE_BUNDLE_ID=... xcodebuild ...
name: SuiSui
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    BASE_BUNDLE_ID: com.yourname.suisui
    APP_GROUP_ID: group.$(BASE_BUNDLE_ID)
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SuiSui:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SuiSui
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SuiSui.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SuiSuiWidgets
        embed: true
  SuiSuiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SuiSuiWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/SuiSuiWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  SuiSuiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SuiSui:
    build:
      targets:
        SuiSui: all
        SuiSuiWidgets: all
    test:
      targets:
        - SuiSuiTests
    archive:
      config: Release
