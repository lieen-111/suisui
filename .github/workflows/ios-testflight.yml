# Archives, signs and uploads the app to TestFlight from a GitHub-hosted Mac — no Mac of your own.
#
# One-time setup (all in a web browser; see ios/README.md):
#   Repository secrets:
#     APPLE_TEAM_ID       10-character Team ID (developer.apple.com > Membership)
#     ASC_KEY_ID          App Store Connect API key ID
#     ASC_ISSUER_ID       App Store Connect API issuer ID
#     ASC_KEY_P8          Full text of the downloaded AuthKey_XXXX.p8 file
#   Repository variable:
#     BUNDLE_ID           e.g. com.yourname.suisui (must match the App ID and App Store Connect record)
#
# TestFlight builds expire after 90 days; the monthly schedule keeps a fresh build available.
name: iOS TestFlight

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - name: Check configuration
        working-directory: .
        run: |
          missing=""
          for v in TEAM_ID KEY_ID ISSUER_ID BUNDLE_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing secrets/variables:$missing (see ios/README.md)"; exit 1; fi

      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive (automatic, cloud-managed signing)
        run: |
          set -o pipefail
          xcodebuild -project SuiSui.xcodeproj -scheme SuiSui -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SuiSui.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" BASE_BUNDLE_ID="$BUNDLE_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee archive.log | grep -E 'error:|ARCHIVE (SUCCEEDED|FAILED)' || true
          grep -q 'ARCHIVE SUCCEEDED' archive.log

      - name: Upload to App Store Connect / TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SuiSui.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee export.log | grep -E 'error:|Upload succeeded|EXPORT (SUCCEEDED|FAILED)' || true
          grep -qE 'EXPORT SUCCEEDED|Upload succeeded' export.log

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log
