# Builds the Android app (android/) on a GitHub-hosted Linux machine and publishes the APK as a release.
# Phone download link (always the newest build):
#   https://github.com/lieen-111/suisui/releases/latest/download/suisui.apk
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk suisui.apk
          ls -la suisui.apk

      - uses: actions/upload-artifact@v4
        with:
          name: suisui-android
          path: suisui.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: 碎碎清单 安卓测试版 ${{ github.run_number }}
          body: |
            用安卓手机浏览器打开下面的 suisui.apk 下载安装。
            首次安装需要允许“安装未知应用”。覆盖安装会保留待办数据。
          files: suisui.apk
          make_latest: true
