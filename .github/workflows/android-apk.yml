# Builds the Android app (android/) on a GitHub-hosted Linux machine and publishes the APK as a release.
# Phone download link (always the newest build):
#   https://github.com/lieen-111/suisui/releases/latest/download/suisui.apk
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Use the private signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SUISUI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SUISUI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=private" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret; signing with the public test key (not for public distribution)."
            echo "SIGNING=test" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk suisui.apk
          ls -la suisui.apk

      - uses: actions/upload-artifact@v4
        with:
          name: suisui-android
          path: suisui.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: 碎碎清单 安卓版 1.1（构建 ${{ github.run_number }}）
          body: |
            用安卓手机浏览器打开下面的 suisui.apk 下载安装。
            首次安装需要允许“安装未知应用”。覆盖安装会保留待办数据。
            签名：${{ env.SIGNING == 'private' && '正式密钥' || '测试密钥（仅供试用）' }}
          files: suisui.apk
          make_latest: true
